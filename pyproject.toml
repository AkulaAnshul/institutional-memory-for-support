[project]
name = "institutional-memory-for-support"
version = "0.1.0"
description = "A support agent with a company-wide institutional memory, built on Hindsight."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "groq>=0.11",
    "hindsight-client>=0.10",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # long lines are fine; readability is handled by the formatter
    "C408",  # dict(...) literals are explicit and readable here
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
